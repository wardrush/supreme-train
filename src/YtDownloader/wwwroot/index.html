<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YT Download</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1b1b1b; --muted: #666; --card: #fff; --line: #d6d6d2;
    --accent: #1f5fbf; --accent-fg: #fff; --err: #b3261e; --ok: #1e7b34;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --fg: #ececec; --muted: #9a9a9a; --card: #1f1f1f; --line: #333;
      --accent: #6ea2ff; --accent-fg: #0b0b0b; --err: #ff8a80; --ok: #7ad88f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=url], input[type=password] {
    width: 100%; font-size: 16px; padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle label {
    flex: 1; margin: 0; padding: 12px; text-align: center; color: var(--fg); cursor: pointer; font-size: 1rem;
  }
  .toggle input:checked + label { background: var(--accent); color: var(--accent-fg); }
  .toggle input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -4px; }
  .remember { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: .9rem; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  #status { margin-top: 16px; min-height: 1.5em; white-space: pre-wrap; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  p.note { color: var(--muted); font-size: .85rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>YouTube download</h1>
  <form id="f" autocomplete="on">
    <label for="url">Video URL</label>
    <input id="url" name="url" type="url" inputmode="url" required
           placeholder="https://youtu.be/…" autocomplete="off">

    <label>Format</label>
    <div class="toggle" role="radiogroup">
      <input type="radio" id="fmt-mp4" name="format" value="mp4" checked>
      <label for="fmt-mp4">Video (mp4)</label>
      <input type="radio" id="fmt-mp3" name="format" value="mp3">
      <label for="fmt-mp3">Audio (mp3)</label>
    </div>

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" required autocomplete="current-password">
    <div class="remember">
      <input type="checkbox" id="remember">
      <span><label for="remember" style="display:inline;margin:0">Remember on this device</label></span>
    </div>

    <button id="go" type="submit">Download</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
  <p class="note">Conversion runs on the server first, then the file downloads. Long videos can take a few minutes.</p>
</main>
<script>
(() => {
  const KEY = "ytdl-pw";
  const $ = id => document.getElementById(id);
  const form = $("f"), pw = $("pw"), remember = $("remember"), go = $("go"), status = $("status");

  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} },
  };

  const saved = store.get();
  if (saved) { pw.value = saved; remember.checked = true; }

  // Prefill from a shared link, e.g. the iOS/Android share sheet opening ?url=…
  const shared = new URLSearchParams(location.search).get("url");
  if (shared) $("url").value = shared;

  function show(text, kind) { status.textContent = text; status.className = kind || ""; }

  function fileNameFrom(header, fallback) {
    if (!header) return fallback;
    const star = /filename\*=UTF-8''([^;]+)/i.exec(header);
    if (star) { try { return decodeURIComponent(star[1]); } catch {} }
    const plain = /filename="?([^";]+)"?/i.exec(header);
    return plain ? plain[1] : fallback;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const format = form.format.value;
    if (remember.checked) store.set(pw.value); else store.clear();

    go.disabled = true;
    const started = Date.now();
    show("Converting…");
    const tick = setInterval(() => show(`Converting… ${Math.round((Date.now() - started) / 1000)}s`), 1000);

    try {
      const res = await fetch("/api/convert", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Password": pw.value },
        body: JSON.stringify({ url: $("url").value, format }),
      });

      if (!res.ok) {
        let msg = `Error ${res.status}`;
        try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
        if (res.status === 401) store.clear();
        clearInterval(tick);
        show(msg, "err");
        return;
      }

      clearInterval(tick);
      show("Downloading file…");
      const blob = await res.blob();
      const name = fileNameFrom(res.headers.get("Content-Disposition"), `download.${format}`);
      const href = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = href; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(href), 60_000);
      show(`Done: ${name} (${(blob.size / 1048576).toFixed(1)} MB)`, "ok");
    } catch (err) {
      clearInterval(tick);
      show("Network error: " + err.message, "err");
    } finally {
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
